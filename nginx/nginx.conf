# /etc/nginx/nginx.conf
#
# NO EDITAR ESTE ARCHIVO EN EL SERVIDOR: Nube lo reemplaza en cada push al
# repositorio del servidor. Edita nginx/nginx.conf en el repositorio y hace
# "git push server main".
#
# Los placeholders #NUBE_*# los reemplaza install.sh con los valores de
# /etc/nube/nube.conf.

user #NUBE_WEB_GROUP#;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

# Modulos dinamicos instalados por el paquete de Ubuntu.
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # --- Basicos ---------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # No filtrar la version de nginx en errores ni en headers.
    server_tokens off;

    # Subidas. Aumentalo si tu app acepta archivos grandes.
    client_max_body_size 32m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # --- Logs ------------------------------------------------------------
    # El formato debe coincidir con fail2ban/filter.d/nginx-nube-scan.conf.
    log_format nube '$host $remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" $request_time';
    access_log /var/log/nginx/access.log nube;
    error_log  /var/log/nginx/error.log warn;

    # --- Rate limit ------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=nube_req:10m  rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=nube_conn:10m;

    # --- MIME y compresion ----------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1100;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_static on;
    gzip_disable "MSIE [1-6]\.";
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/truetype font/opentype
        application/vnd.ms-fontobject;

    # --- Sitios ----------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
