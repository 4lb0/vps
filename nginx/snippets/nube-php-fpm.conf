# /etc/nginx/snippets/nube-php-fpm.conf
#
# Archivos estaticos + PHP-FPM.
# La version de PHP sale de NUBE_PHP_VERSION (/etc/nube/nube.conf).

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    try_files $uri =404;

    include        /etc/nginx/fastcgi.conf;
    fastcgi_index  index.php;
    fastcgi_pass   unix:/run/php/php#NUBE_PHP_VERSION#-fpm.sock;

    fastcgi_hide_header X-Powered-By;
}

# No servir archivos ocultos (excepto el challenge de ACME).
location ~ /\.(?!well-known) {
    deny all;
}

# No exponer backups ni configuraciones.
location ~* \.(env|log|sql|bak|old|ini|conf|yml|yaml)$ {
    deny all;
}

# Paginas de error
error_page 404 /404.html;
location = /404.html {
    internal;
}

error_page 500 502 503 504 /50x.html;
location = /50x.html {
    internal;
}
