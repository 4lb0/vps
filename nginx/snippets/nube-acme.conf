# /etc/nginx/snippets/nube-acme.conf
#
# Sirve el challenge HTTP-01 de acme.sh.
# NUBE_ACME_WEBROOT debe apuntar al mismo directorio que usa nd
# (por defecto /var/www/acme; ver /etc/nube/nube.conf).

location ^~ /.well-known/acme-challenge/ {
    root #NUBE_ACME_WEBROOT#;
    default_type text/plain;
    try_files $uri =404;
    access_log off;
}
