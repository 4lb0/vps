# /etc/nginx/conf.d/nube.conf
#
# NO EDITAR ESTE ARCHIVO EN EL SERVIDOR: Nube lo reemplaza en cada push al
# repositorio del servidor. Edita nginx/conf.d/nube.conf y hace push.
#
#   1. HTTP: resuelve el challenge de acme.sh y redirige a HTTPS.
#   2. HTTPS wildcard: *.NUBE_BASE_DOMAIN (un certificado para todas las apps).
#   3. HTTPS catch-all: dominios propios, con el certificado de cada uno.

# --- 1. HTTP ------------------------------------------------------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # Sirve /.well-known/acme-challenge/ desde #NUBE_ACME_WEBROOT#
    include /etc/nginx/snippets/nube-acme.conf;

    include /etc/nginx/snippets/nube-block-scanners.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 2. Subdominios del dominio base ------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name ~^(?<app>.+)\.#NUBE_BASE_DOMAIN_REGEX#$;

    root  #NUBE_WEB_ROOT#/$app.#NUBE_BASE_DOMAIN#/public;
    index index.php index.html;

    # Certificado wildcard emitido con acme.sh (DNS-01). Mientras no exista,
    # install.sh deja uno autofirmado para que nginx arranque.
    ssl_certificate     #NUBE_NGINX_SSL_DIR#/nube.crt;
    ssl_certificate_key #NUBE_NGINX_SSL_DIR#/nube.key;

    include /etc/nginx/snippets/nube-ssl.conf;
    include /etc/nginx/snippets/nube-security-headers.conf;
    include /etc/nginx/snippets/nube-block-scanners.conf;
    include /etc/nginx/snippets/nube-php-fpm.conf;
}

# --- 3. Dominios propios ------------------------------------------------
# El certificado de cada dominio lo instala "nube-add-domain" en
# #NUBE_NGINX_SSL_DIR#/<dominio>/ y nginx lo busca por SNI.
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name ~^(www\.)?(?<domain>.+)$;

    root  #NUBE_WEB_ROOT#/$domain/public;
    index index.php index.html;

    ssl_certificate     #NUBE_NGINX_SSL_DIR#/$ssl_server_name/fullchain.pem;
    ssl_certificate_key #NUBE_NGINX_SSL_DIR#/$ssl_server_name/key.pem;

    include /etc/nginx/snippets/nube-ssl.conf;
    include /etc/nginx/snippets/nube-security-headers.conf;
    include /etc/nginx/snippets/nube-block-scanners.conf;
    include /etc/nginx/snippets/nube-php-fpm.conf;
}
