# /etc/nginx/snippets/nube-acme.conf
#
# Sirve el challenge HTTP-01 de acme.sh.
# NUBE_ACME_WEBROOT debe apuntar a /var/www/acme (ver /etc/nube/nube.conf).

location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
    try_files $uri =404;
    access_log off;
}
