# /etc/nginx/nginx.conf
#
# Configuracion principal de ejemplo para un servidor Nube.
# Reemplaza la de Ubuntu. Mantene el include de conf.d: ahi va nube.conf.
#
# Ver docs/03-instalar-nube.md y docs/06-seguridad.md.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # --- Básicos ---------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # No filtrar la version de nginx en errores ni en headers.
    server_tokens off;

    # Subidas. Aumentalo si tu app acepta archivos grandes.
    client_max_body_size 32m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # --- Logs ------------------------------------------------------------
    # El formato debe coincidir con fail2ban/filter.d/nginx-nube-scan.conf.
    log_format nube '$host $remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" $request_time';
    access_log /var/log/nginx/access.log nube;
    error_log  /var/log/nginx/error.log warn;

    # --- Rate limit ------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=nube_req:10m  rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=nube_conn:10m;

    # --- MIME y compresion ----------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1100;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff2;

    # --- Sitios ----------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
