# /etc/nginx/conf.d/nube.conf
#
# Sitios de Nube.
#
#   1. HTTP: resuelve el challenge de acme.sh y redirige a HTTPS.
#   2. HTTPS wildcard: *.nube.example.com
#   3. HTTPS catch-all: dominios propios (uno por app, cert en acme.sh)
#
# Reemplaza nube.example.com por tu NUBE_BASE_DOMAIN.

# --- 1. HTTP ------------------------------------------------------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # Sirve /.well-known/acme-challenge/ desde /var/www/acme
    include /etc/nginx/snippets/nube-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 2. Subdominios *.nube.example.com ----------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name ~^(?<app>.+)\.nube\.example\.com$;

    root  /var/www/$app.nube.example.com/public;
    index index.php index.html;

    ssl_certificate     /etc/nginx/ssl/nube.crt;
    ssl_certificate_key /etc/nginx/ssl/nube.key;

    include /etc/nginx/snippets/nube-ssl.conf;
    include /etc/nginx/snippets/nube-security-headers.conf;
    include /etc/nginx/snippets/nube-php-fpm.conf;
}

# --- 3. Dominios propios ------------------------------------------------
# El certificado de cada dominio lo emite "nd" con acme.sh. nginx lo busca
# por SNI en $ssl_server_name.
server {
    listen      443 ssl http2 default_server;
    listen      [::]:443 ssl http2 default_server;
    server_name ~^(www\.)?(?<domain>.+)$;

    root  /var/www/$domain/public;
    index index.php index.html;

    ssl_certificate     /etc/nginx/ssl/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/$ssl_server_name/key.pem;

    include /etc/nginx/snippets/nube-ssl.conf;
    include /etc/nginx/snippets/nube-security-headers.conf;
    include /etc/nginx/snippets/nube-php-fpm.conf;
}
