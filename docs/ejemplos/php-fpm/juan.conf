; /etc/php/8.3/fpm/pool.d/juan.conf
;
; Pool de PHP-FPM aislado para el usuario de deploy "juan".
; Ver docs/06-seguridad.md#php-fpm-por-usuario.
;
; Luego de copiarlo:
;   sudo install -d -o juan -g juan -m 0700 /home/juan/tmp
;   sudo systemctl reload php8.3-fpm
; Y en el server de nginx de este usuario:
;   fastcgi_pass unix:/run/php/nube-juan.sock;

[juan]
user  = juan
group = juan

listen       = /run/php/nube-juan.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; ondemand libera RAM cuando no hay trafico: ideal para muchos sitios chicos.
pm                   = ondemand
pm.max_children      = 5
pm.process_idle_timeout = 10s
pm.max_requests      = 500

; Aislamiento de archivos. Puede romper apps que leen fuera del home:
; probalo antes de aplicarlo a produccion.
php_admin_value[open_basedir]       = /home/juan:/tmp
php_admin_value[session.save_path]  = /home/juan/tmp
php_admin_value[upload_tmp_dir]     = /home/juan/tmp

; Evita ejecucion de comandos desde la web. Ajusta la lista si tu app
; necesita alguna (por ejemplo, para generar PDFs).
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen

php_admin_flag[log_errors]   = on
php_admin_value[error_log]   = /home/juan/php-error.log

php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size]       = 32M
php_admin_value[memory_limit]        = 256M
