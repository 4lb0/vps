[Definition]
# Detecta pedidos a rutas que solo buscan escaneres automaticos.
# Formato de log de Nube (nginx.conf):
#   $host $remote_addr - $remote_user [$time_local] "$request" $status ...
#
# Si cambias log_format, actualiza este filtro.
failregex = ^\S+ <HOST> - \S+ \[[^\]]+\] "(?:GET|POST|HEAD|PUT|PATCH|OPTIONS) /[^"]*(?:wp-login|wp-admin|wp-content|wp-includes|xmlrpc|phpmyadmin|pma|websql|\.env|\.git|\.svn|\.aws|\.ssh|/vendor/|/config/)[^"]*" \d{3}

ignoreregex =

# El timestamp no esta al inicio de la linea: viene despues del host.
datepattern = ^[^\[]*\[({DATE})\]
